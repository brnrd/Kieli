name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run smoke:features
      - run: npm run smoke:apple
      - run: npm run smoke:glossary
      - run: npm run smoke:memory
      - run: npm run smoke:rename
      - run: npm run smoke:archive
      - run: npm run smoke:languages
      - run: npm run smoke:bulk
      - run: npm run smoke:duplicate
      - run: npm run smoke:subset
      - run: npm run smoke:local
      - run: npm run smoke:saml
      - run: npm run smoke:sso
      - run: npm run smoke:sync
      - run: npm run smoke:mcp
      - run: npm run smoke:install
      - run: systemd-analyze verify infra/standalone/kieli.service
      - run: node scripts/render-aws-template.mjs /tmp/kieli-install-template.yaml
      - run: pipx run cfn-lint /tmp/kieli-install-template.yaml infra/release-publisher.yaml
      - run: npm audit --omit=dev --audit-level=high
  terraform-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/render-terraform-template.mjs
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - run: terraform -chdir=infra/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
      - run: pipx run cfn-lint infra/terraform/.generated/install.json
