AWSTemplateFormatVersion: '2010-09-09'
Description: Maintainer-only public Keylo release artifacts and GitHub OIDC publisher. Never stores customer data. Account-level S3 public-policy controls must permit this dedicated public artifact bucket.
Parameters:
  GitHubRepository:
    Type: String
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
    Description: Exact owner/repository trusted to publish through the aws-release GitHub environment.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|arn:aws:iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com'
    Description: Reuse an existing provider when present, including for additional regional publisher stacks in the same account.
Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  Releases:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
  ReleasePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Releases
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicOpenSourceReleases
            Effect: Allow
            Principal: '*'
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub '${Releases.Arn}/releases/*'
          - Sid: RequireHttps
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Releases.Arn, !Sub '${Releases.Arn}/*']
            Condition:
              Bool: {'aws:SecureTransport': 'false'}
  Publisher:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepository}:environment:aws-release'
      Policies:
        - PolicyName: PublishKeyloReleases
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${Releases.Arn}/releases/*'
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
Outputs:
  Bucket: {Value: !Ref Releases}
  Region: {Value: !Ref 'AWS::Region'}
  PublisherRoleArn: {Value: !GetAtt Publisher.Arn}
  OidcProviderArn:
    Value: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref ExistingGitHubOidcProviderArn]
