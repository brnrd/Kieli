AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Keylo - Astro, Lambda, API Gateway, and DynamoDB. No VPC or database server.
Metadata:
  # The optional SSO secret is empty in local-account deployments. IAM policies
  # for it are emitted only in the corresponding SSO mode.
  cfn-lint:
    config:
      ignore_checks: [W1030]

Parameters:
  SsoProvisioningMode:
    Type: String
    Default: jit
    AllowedValues: [jit, scim]
  ScimSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+"
    Description: SCIM provisioning token secret (plain random token, 32+ characters).
  ReconciliationSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+"
    Description: Optional Okta reconciliation JSON secret with origin, appId, apiToken.
  AuthMode:
    Type: String
    Default: local
    AllowedValues: [local, okta, saml]
    Description: Built-in accounts, Okta OIDC, or SAML SSO. Demo mode is never available in production.
  AppOrigin:
    Type: String
    Default: https://setup.invalid
    AllowedPattern: "https://[a-zA-Z0-9.-]+(?::[0-9]+)?"
    Description: Exact HTTPS origin, with no trailing slash. Set after the first deploy if using the generated API URL.
  OktaIssuer:
    Type: String
    Default: ""
    AllowedPattern: '^$|https://[^\s]+'
    Description: Required only for Okta. Usually https://your-org.okta.com/oauth2/default
  OktaClientId:
    Type: String
    Default: ""
  AppSecretsArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|arn:[^:]+:secretsmanager:.*"
    Description: SSO secrets ARN. For OIDC use OKTA_CLIENT_SECRET/SESSION_SECRET; for SAML use SAML_IDP_CERT/SAML_SP_PRIVATE_KEY/SAML_SP_CERT.
  SamlEntryPoint:
    Type: String
    Default: ""
    AllowedPattern: '^$|https://[^\s]+'
    Description: SAML-only identity-provider HTTP-Redirect SSO URL.
  SamlLogoutUrl:
    Type: String
    Default: ""
    AllowedPattern: '^$|https://[^\s]+'
    Description: Optional SAML IdP Single Logout endpoint. Leave empty to disable SLO.
  SamlIdpIssuer:
    Type: String
    Default: ""
    Description: SAML-only exact IdP entity ID. Okta entity IDs can begin with http://; this is an identifier, not a fetch URL.
  SamlSpEntityId:
    Type: String
    Default: ""
    Description: Optional SAML SP entity ID. Defaults to AppOrigin/auth/saml/metadata.
  SecretsRevision:
    Type: String
    Default: "1"
    Description: Increment when rotating secrets to force a Lambda environment refresh.

Rules:
  ScimConfiguration:
    RuleCondition: !Equals [!Ref SsoProvisioningMode, scim]
    Assertions:
      - Assert: !Or [!Equals [!Ref AuthMode, okta], !Equals [!Ref AuthMode, saml]]
        AssertDescription: SCIM requires SSO.
      - Assert: !Not [!Equals [!Ref ScimSecretArn, ""]]
        AssertDescription: SCIM requires its provisioning secret.
  ReconciliationConfiguration:
    RuleCondition: !Not [!Equals [!Ref ReconciliationSecretArn, ""]]
    Assertions:
      - Assert: !Or [!Equals [!Ref AuthMode, okta], !Equals [!Ref AuthMode, saml]]
        AssertDescription: Reconciliation requires SSO.
Conditions:
  UseScim: !Equals [!Ref SsoProvisioningMode, scim]
  HasSsoReconciliation: !Not [!Equals [!Ref ReconciliationSecretArn, ""]]
  UseOkta: !Equals [!Ref AuthMode, okta]
  UseSaml: !Equals [!Ref AuthMode, saml]
  HasSamlSpEntityId: !Not [!Equals [!Ref SamlSpEntityId, ""]]

Resources:
  SnapshotJobSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Keylo internal snapshot job credential
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: false
  SnapshotRunnerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  SnapshotRunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunKeyloSnapshots
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Ref: SnapshotJobSecret
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  Fn::GetAtt:
                    - App
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - SnapshotRunnerLogs
                    - Arn
  SnapshotRunner:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 40
      Role:
        Fn::GetAtt:
          - SnapshotRunnerRole
          - Arn
      LoggingConfig:
        LogGroup:
          Ref: SnapshotRunnerLogs
      Code:
        ZipFile: |-

          const {SecretsManagerClient,GetSecretValueCommand}=require('@aws-sdk/client-secrets-manager');
          const {LambdaClient,InvokeCommand}=require('@aws-sdk/client-lambda');
          const secrets=new SecretsManagerClient({}); const lambda=new LambdaClient({});
          exports.handler=async()=>{
            const secret=await secrets.send(new GetSecretValueCommand({SecretId:process.env.JOB_SECRET}));
            if(!secret.SecretString||secret.SecretString.length<32) throw Error('Job secret unavailable');
            async function invoke(path) {
              const event={version:'2.0',routeKey:'POST '+path,rawPath:path,rawQueryString:'',headers:{host:'internal.keylo',authorization:'Bearer '+secret.SecretString,'content-type':'application/json'},requestContext:{accountId:'internal',apiId:'internal',domainName:'internal.keylo',domainPrefix:'internal',http:{method:'POST',path,protocol:'HTTP/1.1',sourceIp:'127.0.0.1',userAgent:'keylo-maintenance-runner'},requestId:'maintenance-job',routeKey:'POST '+path,stage:'$default',time:'',timeEpoch:Date.now()},body:'{}',isBase64Encoded:false};
              const response=await lambda.send(new InvokeCommand({FunctionName:process.env.APP_FUNCTION,InvocationType:'RequestResponse',Payload:Buffer.from(JSON.stringify(event))}));
              if(response.FunctionError) throw Error('Maintenance invocation failed');
              const output=JSON.parse(Buffer.from(response.Payload).toString());
              if(output.statusCode!==200) throw Error('Maintenance returned an error');
              const body=JSON.parse(output.isBase64Encoded?Buffer.from(output.body,'base64').toString():output.body);
              if(body.status==='partial-failure') throw Error('Maintenance partially failed; retry on next schedule');
              return body.status;
            }
            const paths=['/tasks/snapshots'];
            if(process.env.RECONCILE_ENABLED==='true') paths.push('/tasks/identities');
            const results=await Promise.allSettled(paths.map(invoke));
            if(results.some(result=>result.status==='rejected')) throw Error('Maintenance failed');
            return {status:'ok'};
          };
      Environment:
        Variables:
          JOB_SECRET:
            Ref: SnapshotJobSecret
          APP_FUNCTION:
            Ref: App
          RECONCILE_ENABLED:
            Fn::If:
              - HasSsoReconciliation
              - "true"
              - "false"
  SnapshotSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Keylo snapshot scheduler and abandoned-data cleanup
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn:
            Fn::GetAtt:
              - SnapshotRunner
              - Arn
          Id: Snapshots
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 300
  SnapshotInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: SnapshotRunner
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
          - SnapshotSchedule
          - Arn
      SourceAccount:
        Ref: AWS::AccountId

  Data:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-app"
      RetentionInDays: 14
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KeyloSnapshotSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SnapshotJobSecret
        - !If
          - UseScim
          - PolicyName: KeyloScimSecret
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref ScimSecretArn
          - !Ref "AWS::NoValue"
        - !If
          - HasSsoReconciliation
          - PolicyName: KeyloReconciliationSecret
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref ReconciliationSecretArn
          - !Ref "AWS::NoValue"
        - PolicyName: KeyloDataAndLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt Data.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AppLogGroup.Arn
        - !If
          - UseSaml
          - PolicyName: KeyloSamlSigningCredentials
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref AppSecretsArn
          - !Ref "AWS::NoValue"

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","route":"$context.routeKey","status":"$context.status","bytes":"$context.responseLength"}'

  App:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ..
      DockerTag: keylo-v1
    Properties:
      FunctionName: !Sub "${AWS::StackName}-app"
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 28
      ReservedConcurrentExecutions: 20
      Role: !GetAtt AppRole.Arn
      Environment:
        Variables:
          APP_ORIGIN: !Ref AppOrigin
          AUTH_MODE: !Ref AuthMode
          SSO_PROVISIONING_MODE: !Ref SsoProvisioningMode
          SSO_SCIM_SECRET_ARN: !If [UseScim, !Ref ScimSecretArn, !Ref "AWS::NoValue"]
          SSO_RECONCILE_SECRET_ARN: !If [HasSsoReconciliation, !Ref ReconciliationSecretArn, !Ref "AWS::NoValue"]
          STORAGE_DRIVER: dynamodb
          DYNAMODB_TABLE: !Ref Data
          KEYLO_SNAPSHOT_JOB_SECRET_ARN: !Ref SnapshotJobSecret
          SAML_ENTRY_POINT:
            !If [UseSaml, !Ref SamlEntryPoint, !Ref "AWS::NoValue"]
          SAML_LOGOUT_URL: !If [UseSaml, !Ref SamlLogoutUrl, !Ref "AWS::NoValue"]
          SAML_IDP_ISSUER:
            !If [UseSaml, !Ref SamlIdpIssuer, !Ref "AWS::NoValue"]
          SAML_SP_ENTITY_ID:
            !If [HasSamlSpEntityId, !Ref SamlSpEntityId, !Ref "AWS::NoValue"]
          SAML_SECRETS_ARN:
            !If [UseSaml, !Ref AppSecretsArn, !Ref "AWS::NoValue"]
          OKTA_ISSUER: !If [UseOkta, !Ref OktaIssuer, !Ref "AWS::NoValue"]
          OKTA_CLIENT_ID: !If [UseOkta, !Ref OktaClientId, !Ref "AWS::NoValue"]
          OKTA_CLIENT_SECRET:
            !If [
              UseOkta,
              !Sub "{{resolve:secretsmanager:${AppSecretsArn}:SecretString:OKTA_CLIENT_SECRET}}",
              !Ref "AWS::NoValue",
            ]
          SESSION_SECRET:
            !If [
              UseOkta,
              !Sub "{{resolve:secretsmanager:${AppSecretsArn}:SecretString:SESSION_SECRET}}",
              !Ref "AWS::NoValue",
            ]
          KEYLO_SECRETS_REVISION: !Ref SecretsRevision
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

Outputs:
  Url:
    Description: Set AppOrigin to this URL. Configure the matching callback only when using Okta.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  DataTable:
    Value: !Ref Data
